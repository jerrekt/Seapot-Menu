server {
    listen 80;
    listen [::]:80;
    server_name menu.adsuaracloud.com;
    root /opt/seapot-menu/site;
    index index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    # /branden = same menu with Branden's picks highlighted (handled in index.html)
    location = /branden { return 301 /branden/; }
    location /branden/ { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
}
